<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect x="16" y="16" width="480" height="480" rx="112" fill="#0c0c0e" stroke="#e5383b" stroke-width="10"/>
  <g transform="translate(256 260) scale(1.0) translate(-256 -256)">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff6b6f"/>
      <stop offset="0.5" stop-color="#e5383b"/>
      <stop offset="1" stop-color="#8f2224"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffc2c3" stop-opacity="0"/>
      <stop offset="0.2" stop-color="#ffc2c3" stop-opacity="0.6"/>
      <stop offset="0.9" stop-color="#ffc2c3" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#ffc2c3" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <g transform="rotate(-12 256 256)">
