      <circle cx="250" cy="220" r="4.4"/><circle cx="276" cy="214" r="3.6"/><circle cx="300" cy="222" r="4.2"/>
      <circle cx="326" cy="230" r="3.4"/><circle cx="350" cy="238" r="3.8"/><circle cx="372" cy="246" r="3"/>
      <circle cx="212" cy="236" r="2.8"/><circle cx="262" cy="236" r="3"/><circle cx="314" cy="240" r="2.8"/>
      <circle cx="430" cy="236" r="2.6"/><circle cx="440" cy="274" r="2.6"/><circle cx="456" cy="226" r="2.2"/>
