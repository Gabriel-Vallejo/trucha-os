    <path d="M112,226 C126,248 126,276 112,298" fill="none" stroke="#0c0c0e" stroke-width="5" stroke-linecap="round" opacity="0.8"/>
    <path d="M46,264 C56,268 66,270 78,268" fill="none" stroke="#0c0c0e" stroke-width="3.5" stroke-linecap="round" opacity="0.7"/>
