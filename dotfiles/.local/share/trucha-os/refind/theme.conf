# Trucha OS! — tema de rEFInd (Crimson Ink). Para quitarlo: borra la línea include de refind.conf.
banner themes/trucha-os/background.png
banner_scale fillscreen
selection_big themes/trucha-os/selection_big.png
selection_small themes/trucha-os/selection_small.png
icons_dir themes/trucha-os/icons
font themes/trucha-os/font.png
big_icon_size 256
small_icon_size 72
resolution max
hideui hints,arrows,badges
showtools shutdown,reboot
# Oculta el cargador de emergencia (copia de systemd-boot) y los restos de Pop!_OS en la partición EFI.
# scan_all_linux_kernels se queda activado: en CachyOS/Arch los kernels no llevan .efi y rEFInd debe verlos.
dont_scan_files EFI/BOOT/BOOTX64.EFI,EFI/systemd/systemd-bootx64.efi,vmlinuz.efi,vmlinuz-previous.efi
dont_scan_dirs EFI/Pop_OS-e75ce5d7-aad3-4561-9911-00d793f00b56
