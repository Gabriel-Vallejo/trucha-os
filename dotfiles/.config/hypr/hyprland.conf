# ─── Crimson Ink · Hyprland ─────────────────────────────────
# Portado a mano desde niri (config.kdl + crimson.kdl + dms/binds.kdl).
# Sesión en paralelo: niri sigue intacto en el login.
# Nota: la sintaxis de windowrule cambió en Hyprland 0.53 (match:...). Si tu versión
# es anterior, las reglas de ventana de abajo darán error: dímelo y las paso al formato viejo.

# ── Monitor ──
monitor = eDP-1, 2560x1600@240, 0x0, 1.5
monitor = , preferred, auto, 1

# ── Entorno ──
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = ELECTRON_OZONE_PLATFORM_HINT,auto
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_QPA_PLATFORMTHEME,qt6ct
env = XCURSOR_THEME,Bibata-Modern-Classic
env = XCURSOR_SIZE,24
env = HYPRCURSOR_THEME,Bibata-Modern-Classic
env = HYPRCURSOR_SIZE,24
# Ghidra, Burp, DataGrip… (Java/XWayland) salen en blanco sin esto
env = _JAVA_AWT_WM_NONREPARENTING,1
# NVIDIA (RTX 5070): descomenta si ves parpadeos o cursor roto
# env = LIBVA_DRIVER_NAME,nvidia
# env = __GLX_VENDOR_LIBRARY_NAME,nvidia
# env = NVD_BACKEND,direct

# ── Arranque ──
exec-once = dms run
exec-once = systemctl --user restart trucha-fondo.service
exec-once = nm-applet --indicator

# ── Entrada ──
input {
    kb_layout = es
    kb_options = lv3:ralt_switch,compose:rctrl
    repeat_delay = 300
    repeat_rate = 40
    numlock_by_default = true
    follow_mouse = 1
    accel_profile = flat
    touchpad {
        natural_scroll = true
        tap-to-click = true
        disable_while_typing = true
        scroll_factor = 0.6
    }
}

# ── Aspecto ──
general {
    gaps_in = 6
    gaps_out = 12
    border_size = 2
    col.active_border = rgba(e5383bff) rgba(ff5a5fff) 135deg
    col.inactive_border = rgba(26262bff)
    # scrolling = el equivalente a niri (columnas con scroll). Si tu versión no lo trae: dwindle
    layout = scrolling
    resize_on_border = true
}

decoration {
    rounding = 14
    active_opacity = 1.0
    inactive_opacity = 0.94
    blur {
        enabled = true
        size = 4
        passes = 3
        noise = 0.03
        vibrancy = 0.3
        brightness = 1.0
    }
    shadow {
        enabled = true
        range = 34
        render_power = 3
        color = rgba(000000a0)
        color_inactive = rgba(00000060)
        offset = 0 8
    }
}

# ── Animaciones (curvas bézier propias: aquí está la gracia de Hyprland) ──
animations {
    enabled = true
    bezier = expo,   0.16, 1, 0.3, 1
    bezier = quad,   0.5, 1, 0.89, 1
    bezier = spring, 0.34, 1.56, 0.64, 1
    animation = windows,    1, 4, spring, popin 80%
    animation = windowsOut, 1, 3, quad,   popin 85%
    animation = fade,       1, 4, expo
    animation = border,     1, 8, expo
    animation = workspaces, 1, 5, expo, slidevert
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    vfr = true
    vrr = 2
    focus_on_activate = true
}

cursor {
    inactive_timeout = 4
    hide_on_key_press = true
}

# ── Reglas de ventana (sintaxis nueva, 0.53+) ──
windowrule = match:class ^(kitty)$, opacity 0.92 0.88
windowrule = match:class ^(trucha-showcase)$, fullscreen on
windowrule = match:class ^(es\.trucha\.Copilot)$, float on
windowrule = match:class ^(es\.trucha\.Copilot)$, size 60% 80%
windowrule = match:class ^(es\.trucha\.Copilot)$, center on
windowrule = match:title ^(Picture-in-Picture|Imagen con imagen)$, float on
windowrule = match:title ^(Picture-in-Picture|Imagen con imagen)$, pin on
windowrule = match:class ^(org\.gnome\.Calculator|blueman-manager|xdg-desktop-portal.*)$, float on
# Blur para los paneles de DMS
layerrule = blur on, match:namespace ^(quickshell|dms.*)$
layerrule = ignore_alpha 0.3, match:namespace ^(quickshell|dms.*)$

# ─── Atajos ─────────────────────────────────────────────────
$mod = SUPER
$dms = dms ipc call

# Sistema / DMS
bind = $mod, Space,       exec, $dms spotlight toggle
bind = $mod, R,           exec, $dms spotlight toggle
bind = $mod, S,           exec, $dms spotlight toggle
bind = ALT,  Space,       exec, $dms spotlight-bar toggle
bind = $mod, V,           exec, $dms clipboard toggle
bind = $mod, M,           exec, $dms dash toggle media
bind = $mod, X,           exec, $dms powermenu toggle
bind = $mod, A,           exec, $dms control-center toggle
bind = $mod SHIFT, D,     exec, $dms dash toggle ""
bind = $mod SHIFT, C,     exec, $dms color-picker toggle
bind = $mod ALT, N,       exec, $dms night toggle
bind = $mod ALT, I,       exec, $dms inhibit toggle
bind = $mod, I,           exec, $dms settings focusOrToggle
bind = $mod, comma,       exec, $dms settings focusOrToggle
bind = $mod, Y,           exec, $dms dash toggle wallpaper
bind = $mod, N,           exec, $dms notifications toggle
bind = $mod CTRL, N,      exec, $dms notepad toggle
bind = $mod, L,           exec, $dms lock lock
bind = $mod ALT, L,       exec, $dms lock lock
bind = CTRL SHIFT, Escape, exec, $dms processlist focusOrToggle
bind = CTRL ALT, Delete,  exec, $dms processlist focusOrToggle
bind = $mod SHIFT, E,     exit
bind = $mod SHIFT, slash, exec, $dms keybinds toggle hyprland
bind = $mod SHIFT, space, exec, $dms spotlight toggleQuery "@ "
bind = $mod ALT, T,       exec, $dms spotlight toggleQuery "% "

# Apps
bind = $mod, Return,      exec, kitty
bind = $mod, T,           exec, kitty
bind = $mod, E,           exec, nautilus --new-window
bind = $mod, B,           exec, google-chrome-stable
bind = $mod, C,           exec, code
bind = $mod ALT, Return,  exec, ~/.local/bin/trucha-showcase
bind = $mod SHIFT, W,     exec, systemctl --user restart trucha-fondo.service
bind = $mod SHIFT, X,     exec, ~/.local/bin/trucha-ocr

# Capturas
bind = , Print,           exec, dms screenshot
bind = CTRL, Print,       exec, dms screenshot full
bind = ALT, Print,        exec, dms screenshot window
bind = $mod, Print,       exec, dms screenshot full
bind = $mod SHIFT, S,     exec, dms screenshot
bind = SHIFT, Print,      exec, $dms quickCapture toggle

# Ventanas
bind = $mod, Q,           killactive
bind = ALT, F4,           killactive
bind = $mod, F,           fullscreen, 1
bind = $mod SHIFT, F,     fullscreen, 0
bind = $mod SHIFT, T,     togglefloating
# Fijar flotante en todos los escritorios (sustituye a niri-float-sticky)
bind = $mod, G,           pin
bind = $mod, W,           togglegroup
# Vista general: requiere el plugin hyprexpo (hyprpm add https://github.com/hyprwm/hyprland-plugins; hyprpm enable hyprexpo)
# bind = $mod, Tab,         hyprexpo:expo, toggle
# bind = $mod, D,           hyprexpo:expo, toggle
bind = ALT,  Tab,         cyclenext
bind = ALT SHIFT, Tab,    cyclenext, prev

# Foco (flechas y hjkl)
bind = $mod, left,  movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up,    movefocus, u
bind = $mod, down,  movefocus, d
bind = $mod, H, movefocus, l
bind = $mod, J, movefocus, d
bind = $mod, K, movefocus, u
# (Mod+L queda para bloquear, como en Windows; derecha = flecha)

# Mover ventana
bind = $mod SHIFT, left,  movewindow, l
bind = $mod SHIFT, right, movewindow, r
bind = $mod SHIFT, up,    movewindow, u
bind = $mod SHIFT, down,  movewindow, d
bind = $mod SHIFT, H, movewindow, l
bind = $mod SHIFT, J, movewindow, d
bind = $mod SHIFT, K, movewindow, u
bind = $mod SHIFT, L, movewindow, r

# Tamaño
bind = $mod, minus, resizeactive, -10% 0
bind = $mod, equal, resizeactive, 10% 0
bind = $mod SHIFT, minus, resizeactive, 0 -10%
bind = $mod SHIFT, equal, resizeactive, 0 10%
bind = $mod CTRL, C, centerwindow

# Monitores
bind = $mod CTRL, left,  focusmonitor, l
bind = $mod CTRL, right, focusmonitor, r
bind = $mod SHIFT CTRL, left,  movewindow, mon:l
bind = $mod SHIFT CTRL, right, movewindow, mon:r

# Escritorios
bind = $mod, Page_Down, workspace, e+1
bind = $mod, Page_Up,   workspace, e-1
bind = $mod, U, workspace, e+1
bind = $mod CTRL, U, movetoworkspace, e+1
bind = $mod CTRL, I, movetoworkspace, e-1
bind = $mod CTRL ALT, D, workspace, empty
bind = $mod, mouse_down, workspace, e+1
bind = $mod, mouse_up,   workspace, e-1

bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9

# Ratón: Mod + arrastrar mueve, Mod + botón derecho redimensiona
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# Multimedia / brillo (repetibles y con la pantalla bloqueada)
bindel = , XF86AudioRaiseVolume, exec, $dms audio increment 3
bindel = , XF86AudioLowerVolume, exec, $dms audio decrement 3
bindl = , XF86AudioMute,    exec, $dms audio mute
bindl = , XF86AudioMicMute, exec, $dms audio micmute
bindl = , XF86AudioPlay,    exec, $dms mpris playPause
bindl = , XF86AudioPause,   exec, $dms mpris playPause
bindl = , XF86AudioNext,    exec, $dms mpris next
bindl = , XF86AudioPrev,    exec, $dms mpris previous
bindel = , XF86MonBrightnessUp,   exec, $dms brightness increment 5 ""
bindel = , XF86MonBrightnessDown, exec, $dms brightness decrement 5 ""
