# ─── Crimson Ink · kitty ─────────────────────────────────────
font_family      JetBrainsMono Nerd Font Mono
bold_font        auto
italic_font      auto
font_size        12.5
disable_ligatures never
# kitty dibuja los bloques y líneas de caja él mismo: sin costuras entre filas
modify_font cell_height 108%

cursor_shape          beam
cursor_beam_thickness 2
cursor_blink_interval 0.6
cursor_trail          3
cursor_trail_decay    0.08 0.3

window_padding_width  14 18
hide_window_decorations yes
confirm_os_window_close 0
background_opacity    0.88
background_blur       32
dynamic_background_opacity yes

tab_bar_edge          top
tab_bar_style         powerline
tab_powerline_style   slanted
tab_bar_min_tabs      2
tab_title_template    " {index} {title} "
active_tab_foreground   #0c0c0e
active_tab_background   #e5383b
active_tab_font_style   bold
inactive_tab_foreground #8a8580
inactive_tab_background #141417
tab_bar_background      #0c0c0e

enable_audio_bell no
visual_bell_duration 0.15
visual_bell_color #a32a2c
url_color #ff5a5f
url_style curly
scrollback_lines 20000
shell_integration enabled
allow_remote_control socket-only
listen_on unix:@kitty

# ─── Paleta ──────────────────────────────────────────────────
foreground            #e4dfda
background            #0c0c0e
selection_foreground  #0c0c0e
selection_background  #e5383b
cursor                #e5383b
cursor_text_color     #0c0c0e
active_border_color   #e5383b
inactive_border_color #2a2a30
mark1_background      #e5383b

color0  #1a1a1e
color8  #4a4a52
color1  #e5383b
color9  #ff5a5f
color2  #8fbf7f
color10 #a8d89a
color3  #e8b04b
color11 #f5c66b
color4  #7a9cc6
color12 #9ab8de
color5  #c26d85
color13 #de8aa2
color6  #7fb3b0
color14 #9cd0cc
color7  #cfcac5
color15 #f5f1ec

# ─── Atajos ──────────────────────────────────────────────────
map ctrl+shift+enter new_window_with_cwd
map ctrl+shift+t     new_tab_with_cwd
map ctrl+shift+equal change_font_size all +1.0
map ctrl+shift+minus change_font_size all -1.0
map ctrl+shift+a>m   set_background_opacity +0.05
map ctrl+shift+a>l   set_background_opacity -0.05
